services:
  minio:
    image: repository.samsungds.net/proxy-docker-registry-1.docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - ../env/minio.env
    volumes:
      - "minio_data:/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      shared-net:
        aliases:
          - minio

  minio-init:
    image: repository.samsungds.net/proxy-docker-registry-1.docker.io/minio/mc:latest
    depends_on:
      - minio
    env_file:
      - ../env/minio.env
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -e
          until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
            sleep 1
          done
          mc mb -p local/emails || true
          mc mb -p local/profile || true
    networks:
      shared-net:
        aliases:
          - minio-init

  api:
    build:
      context: ../apps/api
      args:
        PYTHON_BASE_IMAGE: repository.samsungds.net/proxy-docker-registry-1.docker.io/python:3.12-bullseye
        APT_DEBIAN_REPOSITORY: http://repository.samsungds.net/repository/proxy-apt-mirror.kakao.com-debian
        APT_DEBIAN_CODENAME: bullseye
        APT_DEBIAN_ARCH: amd64
        PIP_INDEX_URL: http://repository.samsungds.net/repository/proxy-pypi-files.pythonhosted.org/simple
        PIP_TRUSTED_HOST: repository.samsungds.net
    env_file:
      - ../env/api.common.env
      - ../env/api.oidc.dev.env
      - ../env/minio.env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: emails
      MINIO_REGION: us-east-1
    depends_on:
      minio:
        condition: service_started
    volumes:
      - "../apps/api:/app"
      - "api_data:/data"
      - "${DATA_MOVEMENT_HOST_PATH:-../data/data_movement}:/data/data_movement"
      - "api_static:/app/staticfiles"
      - "${L3_SPIDER_DATA_HOST_PATH:-../data/l3_spider/daily_anomaly}:/data/l3_spider/daily_anomaly:ro"
      - "${PM_COMPARISON_DATA_HOST_PATH:-../data/pm_spider}:/data/pm_spider:ro"
    expose:
      - "8000"
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -e
          python manage.py migrate --noinput
          python manage.py runserver 0.0.0.0:8000
    networks:
      shared-net:
        aliases:
          - api

  web:
    build:
      context: ../apps/web
      args:
        NODE_BASE_IMAGE: repository.samsungds.net/proxy-docker-registry-1.docker.io/node:20-alpine
        ALPINE_REPOSITORY_MIRROR: http://repository.samsungds.net/repository/proxy-raw-dl-cdn.alpinelinux.org-alpine
        NPM_REGISTRY: http://repository.samsungds.net/repository/proxy-npm-registry.npmjs.org
        NPM_STRICT_SSL: "false"
    env_file:
      - ../env/web.common.env
      - ../env/web.oidc.dev.env
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - "../apps/web:/app"
      - "web_node_modules:/app/node_modules"
    expose:
      - "3000"
    networks:
      shared-net:
        aliases:
          - web

  nginx:
    image: repository.samsungds.net/proxy-docker-registry-1.docker.io/nginx:1.27-alpine
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_ENVSUBST_FILTER: "^TTTM_SPIDER_UPSTREAM$"
      TTTM_SPIDER_UPSTREAM: ${TTTM_SPIDER_UPSTREAM:-10.172.60.187:32710}
    volumes:
      - "../deploy/nginx/default.prod.conf:/etc/nginx/templates/default.conf.template:ro"
      - "api_static:/var/www/static:ro"
      - "../deploy/nginx/certs:/etc/nginx/certs:ro"
    networks:
      - shared-net

volumes:
  api_data:
  api_static:
  minio_data:
  web_node_modules:

networks:
  shared-net:
    external: true
    name: shared-net
