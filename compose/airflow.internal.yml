x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:${POSTGRES_PORT:-8010}/airflow
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__WEBSERVER__BASE_URL: ${AIRFLOW_WEBSERVER_BASE_URL:-http://localhost/airflow}
  AIRFLOW__WEBSERVER__WEB_SERVER_URL_PREFIX: /airflow
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-dev-airflow-webserver-secret-key}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

x-airflow-internal-build: &airflow-internal-build
  context: ../airflow
  dockerfile: Dockerfile
  args:
    AIRFLOW_BASE_IMAGE: repository.samsungds.net/proxy-docker-registry-1.docker.io/apache/airflow:2.11.0
    APT_DEBIAN_REPOSITORY: http://repository.samsungds.net/repository/proxy-apt-mirror.kakao.com-debian
    APT_DEBIAN_CODENAME: bookworm
    APT_DEBIAN_ARCH: amd64
    PIP_INDEX_URL: http://repository.samsungds.net/repository/proxy-pypi-files.pythonhosted.org/simple
    PIP_EXTRA_INDEX_URL: http://repo.samsungds.net/artifactory/api/pypi/pypi-remote
    PIP_TRUSTED_HOST: "repository.samsungds.net repo.samsungds.net"
    INSTALL_BIGDATAQUERY_PYTHON: "true"
    INSTALL_BIGDATAQUERY_ODBC: "true"
    BIGDATAQUERY_ODBC_DEB_URL: http://nexus.adpaas.cloud.samsungds.net/repository/dataservice/odbc/linux/debian/clouderaimpalaodbc_2.8.3.1008-2_amd64.deb

services:
  airflow-postgres:
    image: repository.samsungds.net/proxy-docker-registry-1.docker.io/postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    command: ["postgres", "-p", "${POSTGRES_PORT:-8010}"]
    volumes:
      - "${POSTGRES_DATA_HOST_PATH:-../data/postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-p", "${POSTGRES_PORT:-8010}"]
      interval: 10s
      retries: 5
      start_period: 5s
    ports:
      - "${POSTGRES_PORT:-8010}:${POSTGRES_PORT:-8010}"
    restart: always
    networks:
      shared-net:
        aliases:
          - airflow-postgres

  airflow-init:
    image: airflow:2.11.0-internal
    pull_policy: never
    build: *airflow-internal-build
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "$${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    env_file:
      - ../env/airflow.common.env
    user: "0:0"
    volumes:
      - "../airflow:/sources"
      - "../airflow/odbc:/usr/local/odbc:ro"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      - shared-net

  airflow-webserver:
    image: airflow:2.11.0-internal
    pull_policy: never
    build: *airflow-internal-build
    command: webserver
    environment:
      <<: *airflow-common-env
    env_file:
      - ../env/airflow.common.env
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - "../airflow/dags:/opt/airflow/dags"
      - "../airflow/logs:/opt/airflow/logs"
      - "../airflow/config:/opt/airflow/config"
      - "../airflow/plugins:/opt/airflow/plugins"
      - "../airflow/odbc:/usr/local/odbc:ro"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/airflow/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      shared-net:
        aliases:
          - airflow-webserver

  airflow-scheduler:
    image: airflow:2.11.0-internal
    pull_policy: never
    build: *airflow-internal-build
    command: scheduler
    environment:
      <<: *airflow-common-env
    env_file:
      - ../env/airflow.common.env
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - "../airflow/dags:/opt/airflow/dags"
      - "../airflow/logs:/opt/airflow/logs"
      - "../airflow/config:/opt/airflow/config"
      - "../airflow/plugins:/opt/airflow/plugins"
      - "../airflow/odbc:/usr/local/odbc:ro"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - shared-net

networks:
  shared-net:
    external: true
    name: shared-net
